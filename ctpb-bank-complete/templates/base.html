<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CTPB Bank{% endblock %} · CTPB Bank</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="%230a1128"/><path d="M16 7l7 9-7 9-7-9z" fill="%23f0b429"/></svg>'>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <div class="toast-stack" id="toasts"></div>
  <script>window.__flashes = {{ get_flashed_messages(with_categories=true) | tojson }};</script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
